name: CI

# Validate everything headed for main: pull requests that target it and direct pushes
# (merge commits) to it. Per-component build and test commands are added in later steps.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer commit on the same branch or PR makes an in-flight run obsolete; cancel it so
# CI always reports on the latest push rather than burning minutes on stale ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repository; no write scopes are granted.
permissions:
  contents: read

jobs:
  # Native C++20 clause parser, built and unit-tested with CMake/CTest. RE2 is a system
  # dependency (see parser/CMakeLists.txt); abseil is deliberately avoided.
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake and RE2
        # libabsl-dev satisfies the absl targets re2's CMake config re-exports; without
        # it find_package(re2) fails at its find_dependency(absl) step.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libre2-dev libabsl-dev
      - name: Configure
        run: cmake -S parser -B parser/build
      - name: Build
        run: cmake --build parser/build
      - name: Run tests (CTest)
        run: ctest --test-dir parser/build --output-on-failure

  # .NET 9 backend. The Testcontainers integration suite needs a Docker daemon, which the
  # ubuntu runner provides out of the box.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore backend/ContractAI.sln
      - name: Test
        # The integration suite drives Testcontainers against the ubuntu runner's Docker
        # daemon; unit and API tests run in-process.
        run: dotnet test backend/ContractAI.sln --configuration Release --no-restore

  # React/TypeScript frontend: lint, production build, and the Playwright end-to-end
  # suite. There is no `npm run test` script — the E2E suite is the frontend's test layer,
  # so it runs here via `npx playwright test` (headless by default).
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install Playwright browsers
        # --with-deps pulls the shared libraries headless Chromium needs on a bare runner.
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests (Playwright)
        # The suite starts Vite itself via the `webServer` block in playwright.config.ts.
        run: npx playwright test
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
